<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contact | EverGreen</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<header class="navbar">

    <div class="container nav-container">

        <a href="index.html" class="logo">

            <span class="logo-mark">
                E
            </span>

            <span>
                EverGreen
            </span>

        </a>

    </div>

</header>


<section class="section">

    <div class="container">

        <div class="section-header">

            <div class="section-label">
                Get in touch
            </div>

            <h1 class="section-title">
                Contact Us
            </h1>

            <p class="section-description">

                Official contact information will be
                added once provided.

            </p>

        </div>


        <div class="checkout-card">

            <form
                onsubmit="
                    event.preventDefault();
                    alert('Thank you! Your message has been received.');
                "
            >

                <div class="form-group">

                    <label>
                        Name
                    </label>

                    <input
                        type="text"
                        required
                        placeholder="Your name"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        required
                        placeholder="Your email"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Message
                    </label>

                    <textarea
                        rows="6"
                        required
                        placeholder="Write your message..."
                    ></textarea>

                </div>


                <button
                    type="submit"
                    class="primary-btn"
                >

                    Send Message

                </button>

            </form>

        </div>

    </div>

</section>


<footer class="footer">

    <div class="container">

        <p>
            © 2026 EverGreen. All rights reserved.
        </p>

    </div>

</footer>


</body>

</html>
